name: Deploy Supabase Edge Functions

# Vercel builds the frontend on every push to main, but Supabase Edge
# Functions are a SEPARATE deploy target. Without this workflow, merging
# supabase/functions/** to main changes nothing in production.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - Supabase personal access token (sbp_...)
#   SUPABASE_PROJECT_ID    - e.g. ymzdxifedtjwkxkzfwqu
#
# Verify the result: an unauthenticated POST to a deployed function must NOT
# return {"code":"NOT_FOUND"}.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Skipping Edge Function deploy — set the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID repository secrets to enable it."
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
