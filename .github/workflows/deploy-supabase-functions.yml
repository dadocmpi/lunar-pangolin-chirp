name: Deploy Supabase Edge Functions

# Vercel builds the frontend on every push to main, but Supabase Edge
# Functions are a SEPARATE deploy target. Without this workflow, merging
# supabase/functions/** to main changes nothing in production.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - Supabase personal access token (sbp_...)
#   SUPABASE_PROJECT_ID    - e.g. ymzdxifedtjwkxkzfwqu
#
# Verify the result: an unauthenticated POST to a deployed function must NOT
# return {"code":"NOT_FOUND"}.

# Safety: Edge Functions may only be deployed once the migrations for this
# commit are applied. Edge Functions call tables/RPCs introduced by a
# migration, so deploying them first would break every function on a fresh
# database. Before deploying we ask the database whether it is at the commit's
# migration head; if it is not, we SKIP (not fail) and tell the operator to
# apply migrations first.
#
# This is a deliberate choice over `workflow_dispatch`-only: it keeps the
# automatic deploy for the common case (functions-only change, DB already up to
# date) while making "deploy code before schema" impossible. See
# docs/supabase-deploy-order.md.
#
# There is intentionally NO `workflow_dispatch` trigger here. The manual,
# one-click release (migrations -> functions -> smoke) lives in
# supabase-release.yml, and keeping a second manual trigger would allow a
# double deploy of the same functions.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Pre-flight: compare the migration head of this commit against the
      # migrations already recorded in the target database. A mismatch means
      # migrations for this commit are NOT applied yet -> skip.
      - name: Check target DB is migrated to this commit
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_ID not set; cannot pre-check."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected="$(ls -1 supabase/migrations/*.sql | xargs -n1 basename | sort | tail -1)"
          echo "Commit migration head: $expected"

          # Fetch applied migration versions from the linked project.
          # `supabase migration list --linked` prints a table; the remote column
          # holds applied versions. Fall back to skipping when unavailable.
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            remote="$(supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" 2>/dev/null || true)"
          else
            remote="$(supabase migration list --linked 2>/dev/null || true)"
          fi

          if [ -z "$remote" ]; then
            echo "::warning::Could not read applied migrations (needs SUPABASE_DB_PASSWORD secret). Skipping deploy to be safe."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$remote" | grep -q "$(basename "$expected" .sql)"; then
            echo "Database is at the commit's migration head. Proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Migrations for this commit are NOT applied to the database yet. Skipping Edge Function deploy. Run migrations, then re-run this workflow."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy all Edge Functions
        if: steps.check.outputs.proceed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Skipping Edge Function deploy — set the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID repository secrets to enable it."
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
